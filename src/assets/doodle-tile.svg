    <circle cx="20" cy="140" r="3" />
    <circle cx="132" cy="30" r="3" />
    <circle cx="260" cy="40" r="3" />
    <circle cx="400" cy="30" r="3" />
    <circle cx="200" cy="148" r="3" />
    <circle cx="392" cy="110" r="3" />
    <circle cx="190" cy="236" r="3" />
    <circle cx="20" cy="290" r="3" />
    <circle cx="400" cy="270" r="3" />
    <circle cx="130" cy="340" r="3" />
    <circle cx="340" cy="396" r="3" />
    <circle cx="150" cy="400" r="3" />
    <circle cx="20" cy="410" r="3" />
  </g>
</svg>
