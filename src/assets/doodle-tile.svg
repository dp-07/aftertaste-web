  <!-- heart -->
  <g transform="translate(386 172) rotate(10) scale(0.7)">
    <path d="M0 14 C-22 0 -18 -18 -8 -18 C-4 -18 0 -14 0 -10 C0 -14 4 -18 8 -18 C18 -18 22 0 0 14 Z" />
  </g>

  <!-- sparkles -->
  <g stroke-width="2.6">
    <path d="M122 118 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" />
    <path d="M256 122 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" />
    <path d="M356 236 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" />
    <path d="M120 262 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" />
    <path d="M300 280 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" />
